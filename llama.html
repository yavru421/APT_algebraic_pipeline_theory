<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama API · APT Hub</title>
    <style>
        :root {
            --bg: #ffffff;
            --accent: #007bff;
            --text: #333333;
            --card: #f8f9fa;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .portal-shell {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero-portal {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .hero-portal h1 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .portal-card {
            background: var(--card);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 10px var(--shadow);
            text-align: center;
            margin-bottom: 20px;
        }

        .portal-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s;
            margin: 10px;
            font-size: 1.1rem;
        }

        .portal-link:hover {
            background: #0056b3;
        }

        .back-link {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="portal-shell">
        <header class="hero-portal">
            <h1>🧠 Llama API Server</h1>
            <p>Direct access to the local Llama model server</p>
        </header>

        <section class="portal-card">
            <h2>Access Options</h2>
            <p>Choose your preferred connection method:</p>

            <a href="http://100.115.115.21:7860" class="portal-link" target="_blank" rel="noopener noreferrer">
                🌐 Access API (Tailscale)
            </a>

            <a href="http://q3wq6eoehgbusayj4spargrgxo2zdz2kgjvr2owmxou6p7xhnk4wcmad.onion" class="portal-link"
                target="_blank" rel="noopener noreferrer">
                🧅 Access API (Tor)
            </a>

            <p style="margin-top: 20px; font-size: 0.9rem; color: #666;">
                Use for API calls to generate responses and analyze data.
            </p>
        </section>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">← Back to Portal</a>
        </div>
    </div>
</body>

</html>
