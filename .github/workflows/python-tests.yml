name: Python tests

on:
  # Only run on pull requests to main when code changes (avoid running for docs-only edits)
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'apt_pipeline_pkg/**'
      - 'tests/**'
      - 'requirements.txt'
  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q
      - name: Run .RAPT smoke test
        env:
          APT_AUTO_INSTALL: "0"
        run: |
          python scripts/apt_runner.py RAPT_PIPELINE.RAPT
